# Minimal CI (D-051 follow-on task; test tooling under D-047).
# Supporting evidence only: a CI pass is not independent reproduction (D-045)
# and says nothing about anatomical or biomechanical validity (D-051 item 10).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip freeze
      - name: Commit under test
        run: git rev-parse HEAD
      - name: Test suite
        run: python -m pytest -q
      - name: Integrity check
        run: python -m src.integrity
