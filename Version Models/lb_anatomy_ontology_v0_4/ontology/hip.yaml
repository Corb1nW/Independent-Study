    - LB:JOINT:HIP_R
    - LB:JOINT:HIP_L
    - LB:SEG:PELVIS
    - LB:SEG:THIGH_R
    - LB:SEG:THIGH_L
    assumptions:
    - sagittal_plane_motion
    - hip_represented_as_idealized_revolute_joint
    - rigid_pelvis
    - rigid_thighs
    - no_explicit_cartilage_contact
    - no_explicit_capsular_or_ligament_force
    - no_explicit_muscle_path_geometry
    retained_coordinates:
    - LB:DOF:HIP_FLEX_EXT_R
    - LB:DOF:HIP_FLEX_EXT_L
    omitted_coordinates:
    - LB:DOF:HIP_AB_AD_R
    - LB:DOF:HIP_AB_AD_L
    - LB:DOF:HIP_ROTATION_R
    - LB:DOF:HIP_ROTATION_L
