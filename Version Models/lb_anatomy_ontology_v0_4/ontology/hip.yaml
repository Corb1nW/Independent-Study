ontology:
  id: LB-AO
  version: 0.2.0
  module: pelvis_hip_complex
  description: Reference ontology for pelvis and hip anatomy, biomechanics, and model abstractions.
  principles:
  - anatomical_fact_is_separate_from_model_assumption
  - entities_have_stable_ids
  - relationships_use_controlled_predicates
  - numerical_parameters_require_provenance
  - laterality_is_explicit
  - deferred_cross_module_attachments_are_documented
sources:
  SRC:STATPEARLS_HIP:
    title: Anatomy, Bony Pelvis and Lower Limb, Hip
    publisher: NCBI Bookshelf / StatPearls
    url: https://www.ncbi.nlm.nih.gov/books/NBK526019/
    supports:
    - hip anatomy
    - major muscle attachments
    - major muscle innervation
    - hip stability
  SRC:ISB_WU_2002:
    title: 'ISB recommendation on definitions of joint coordinate system: ankle, hip, spine'
    citation: Wu G, et al. Journal of Biomechanics. 2002;35(4):543-548. PMID 11934426.
    url: https://pubmed.ncbi.nlm.nih.gov/11934426/
    supports:
    - hip joint coordinate system
    - reporting convention
  SRC:OPENSIM_GAIT2392:
    title: Gait2392 and Gait2354 Models
    publisher: OpenSim Documentation
    url: https://opensimconfluence.atlassian.net/wiki/spaces/OpenSim/pages/53086215
    supports:
    - computational abstraction
    - pelvic frame example
    - hip ball-and-socket representation
    - muscle path representation
  SRC:HIP_CAPSULE_REVIEW:
    title: Hip Joint Capsular Anatomy, Mechanics, and Surgical Management
    citation: Jimenez AE, et al. JBJS Reviews. 2020. PMCID PMC7406151.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7406151/
    supports:
    - capsular ligaments
    - zona orbicularis
    - capsular mechanics
relationship_types:
- IS_A
- PART_OF
- HAS_PART
- ATTACHES_TO
- ORIGINATES_FROM
- INSERTS_ON
- ARTICULATES_WITH
- CROSSES
- CONNECTS
- COVERED_BY
- REINFORCES
- INNERVATED_BY
- GENERATES
- TRANSMITS_FORCE_TO
- ACTS_ON
- CONSTRAINS
- STABILIZES
- HAS_FRAME
- REPRESENTED_BY
- MEASURED_BY
- ESTIMATED_BY
- HAS_LANDMARK
- HAS_SURFACE
- HAS_COORDINATE
- ASSOCIATED_WITH
