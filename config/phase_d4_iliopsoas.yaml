# Stage D4 growth run (D-062 items 8 and 9): squat_d4 with Gait2392's iliacus and psoas, added as data only.
# Reported, not a new baseline. Everything else is the D4 configuration (config/phase_d4_assembled.yaml).
model_id: PHASE_D4_ILIOPSOAS_GROWTH_DEMONSTRATION
decision: D-062
specification: squat_d4_iliopsoas
baseline_variant: moving_knee
d1_config: config/phase_d1_squat.yaml
d2_config: config/phase_d2_muscles.yaml
d3_config: config/phase_d3_moving_knee.yaml
bodies: [female, male, gait2392]
variants: [moving_knee, fixed_knee]
references:
  fixed_knee:
    path: tests/data/d2_oracle_reference.json        # the 14 D2 actuators; the hip-only iliopsoas does not see the knee
    coverage_mode: fixed
  moving_knee:
    path: tests/data/d4_iliopsoas_oracle_reference.json   # all 16 actuators, written with --spec squat_d4_iliopsoas
    coverage_mode: moving
    kinematics:
      knee_m: [origin, LB:SEG:SHANK_R]
      hip_m: [origin, LB:SEG:THIGH_R]
      pelvis_origin_m: [origin, LB:SEG:HAT]
      femur_com_m: [com, LB:SEG:THIGH_R]
      tibia_com_m: [com, LB:SEG:SHANK_R]
direction_check_reference_variants: [fixed_knee]
regression:
  coordinate_labels:
    LB:DOF:ANKLE_DORSI_PLANTAR_R: ankle
    LB:DOF:KNEE_FLEX_EXT_R: knee
    LB:DOF:HIP_FLEX_EXT_R: hip
  point_labels: {}
  series: {}
  statuses: {}
  manifests: {}        # a growth run is reported, not regressed to an earlier stage (D-062 item 9)
# Pre-stated before the growth run (D-062 item 9). The measure is D-060 Amendment 2's: at each sample, the smaller of
# the largest gastrocnemius activation and the tibialis anterior activation; its largest value in the windows near
# standing that Amendment 2 used. D3 reported 0.113 / 0.130 / 0.136 (female / male / Gait2392) there.
# "Removed" is read as at most 0.01 for every body: an order of magnitude below the smallest value Stage D2 or D3
# reported near standing (0.047). The threshold is the builder's reading of "removes", stated here before the run.
hypotheses:
  - id: H1
    statement: Adding iliopsoas removes the gastrocnemius-tibialis co-activation near standing found in D3 (D-060 Amendment 2).
    measure: smaller_of_group_maxima
    groups: [[med_gas_r, lat_gas_r], [tib_ant_r]]
    windows_s: [[0.0, 0.19], [2.81, 3.0]]
    removed_if_at_most: 0.01
    comparison: results/phase_d/2026-11-11_d3_moving_knee_runs_d3efc56.json
assumptions:
  - "Model: the squat_d4_iliopsoas specification (squat_d4 plus Gait2392's iliacus_r and psoas_r), assembled by the same generic code"
  - "Baseline: Gait2392's moving knee (D-060); the fixed-knee variant is run for the consistency checks"
  - "Motion, contact, force law and recruitment exactly as configured for D1 and D2"
omitted_physics:
  status: deliberate_demonstration_simplifications
  listed_in: "the manifest's consistency.C5_deviation_register, generated from the ontology (D-062 item 7)"
