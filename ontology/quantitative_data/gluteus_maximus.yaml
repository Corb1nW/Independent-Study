dataset:
  id: LB-QD:GLUTEUS_MAXIMUS
  version: 0.2.0
  description: Evidence-traceable baseline quantitative template for gluteus maximus.
  bilateral_policy:
    assumption: symmetric_baseline
    rationale: Use one generic evidence-backed baseline to initialize both sides for the current model.
    anatomical_fact: false
    shared_baseline_targets: [LB:MUS:GLUTEUS_MAXIMUS_R, LB:MUS:GLUTEUS_MAXIMUS_L]
    independent_override_supported: true
    override_rule: A side-specific or subject-specific datum may supersede the shared baseline for that target without changing the source observation.

sources:
  SRC:WARD_2009:
    title: Are Current Measurements of Lower Extremity Muscle Architecture Accurate?
    citation: Ward SR, Eng CM, Smallwood LH, Lieber RL. Clin Orthop Relat Res. 2009;467(4):1074-1082.
    doi: 10.1007/s11999-008-0594-8
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2650051/
    evidence_domain: experimental_biomechanics
    role: primary_experimental_source
  SRC:ARNOLD_2010:
    title: A model of the lower limb for analysis of human movement
    citation: Arnold EM, Ward SR, Lieber RL, Delp SL. Ann Biomed Eng. 2010;38(2):269-279.
    doi: 10.1007/s10439-009-9852-5
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2903973/
    evidence_domain: musculotendon_model
    role: model_translation_source
  SRC:ARNOLD_DELP_2011:
    title: Fibre operating lengths of human lower limb muscles during walking
    citation: Arnold EM, Delp SL. Philos Trans R Soc Lond B Biol Sci. 2011;366:1530-1539.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3130447/
    evidence_domain: computational_model
    role: downstream_model_use_and_method_crosscheck

common:
  target:
    entity_ids: [LB:MUS:GLUTEUS_MAXIMUS_R, LB:MUS:GLUTEUS_MAXIMUS_L]
    anatomical_scope: gluteus_maximus_whole_muscle
    laterality: shared_bilateral_baseline
    computational_representation: generic_whole_muscle_baseline
  symmetry_policy:
    baseline_assumption: symmetric_baseline
    shared_baseline_group: LB:BASELINE:GMAX:BILATERAL
    independent_override_supported: true
  applicability:
    level: cohort
    population: human cadaver lower-extremity specimens in Ward et al. 2009
    sample_size: 18
    age: source cohort is elderly; Arnold et al. reports overall architecture cohort mean age 82.5 +/- 9.42 years
    sex: overall architecture cohort reported by Arnold et al. as 12 female and 9 male; muscle-specific sex breakdown not encoded
    body_mass_kg: null
    stature_m: null
    pathology_or_condition: null
    inclusion_notes: Cohort-level baseline evidence, not a direct measurement of a digital-twin subject.
    model_id: null
    subject_id: null
  quality:
    validation_status: reviewed_for_source_traceability
    limitations:
      - cadaver-derived architecture
      - elderly source cohort
      - cohort-level rather than subject-specific
      - bilateral equality is a current model assumption, not an anatomical claim
    conflicts_with: []
    reviewer_notes: Reference-muscle template for LB-AO.

