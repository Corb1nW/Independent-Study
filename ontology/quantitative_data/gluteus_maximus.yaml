    derivation:
      inputs:
        - {name: model_pcsa, value: 30.37, unit: 'cm^2', source_id: SRC:ARNOLD_2010}
        - {name: specific_tension, value: 61.0, unit: 'N/cm^2', source_id: SRC:ARNOLD_2010, role: model_assumption}
      formula: 'Fmax = PCSA * specific_tension'
      assumptions:
