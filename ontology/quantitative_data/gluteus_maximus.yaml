    unit: kg
    uncertainty: {type: standard_deviation, value: 0.1622, unit: kg, confidence_level: null, distribution: null}
    datum_kind: literature_derived
    method: {name: cadaveric_muscle_architecture_measurement, description: Ward et al. Table 3 whole-muscle mass., direct_measurement: true, derived_from: []}
    provenance:
      source_claims:
        - {source_id: SRC:WARD_2009, supports: [gluteus_maximus_mass_mean, gluteus_maximus_mass_standard_deviation, sample_size], evidence_domain: experimental_biomechanics, claim_scope: 'Table 3, gluteus maximus row', value_directly_reported: true, notes: '547.2 +/- 162.2 g; n=18'}
      source_value_location: Ward et al. 2009 Table 3
      retrieval_date: '2026-09-30'
      transformation_history:
        - {operation: unit_conversion, input_value: 547.2, input_unit: g, output_value: 0.5472, output_unit: kg, formula: 'kg = g / 1000'}
