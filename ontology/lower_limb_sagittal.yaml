models:
  squat_d1:
    represents:
    - LB:SEG:FOOT_R
    - LB:SEG:SHANK_R
    - LB:SEG:THIGH_R
    - LB:SEG:HAT
    - LB:JOINT:ANKLE_R
    - LB:JOINT:KNEE_R
    - LB:JOINT:HIP_R
    assumptions:
    - sagittal_plane_motion
    - bilateral_symmetry_one_leg_carries_half_HAT
    - foot_fixed_flat_to_ground
    - joints_idealized_revolute_with_fixed_centres
    - rigid_segments
    - low_back_joint_locked
    - prescribed_motion_inverse_dynamics
    retained_coordinates:
    - LB:DOF:ANKLE_DORSI_PLANTAR_R
    - LB:DOF:KNEE_FLEX_EXT_R
    - LB:DOF:HIP_FLEX_EXT_R
    omitted_coordinates:
    - LB:DOF:HIP_AB_AD_R
    - LB:DOF:HIP_ROTATION_R
  squat_d2:
    extends: squat_d1
    represents:
    - LB:ACT:G2392:GLUT_MAX1_R
    - LB:ACT:G2392:GLUT_MAX2_R
    - LB:ACT:G2392:GLUT_MAX3_R
    - LB:ACT:G2392:BIFEMLH_R
    - LB:ACT:G2392:SEMIMEM_R
    - LB:ACT:G2392:SEMITEN_R
    - LB:ACT:G2392:VAS_MED_R
    - LB:ACT:G2392:VAS_INT_R
    - LB:ACT:G2392:VAS_LAT_R
    - LB:ACT:G2392:RECT_FEM_R
    - LB:ACT:G2392:MED_GAS_R
    - LB:ACT:G2392:LAT_GAS_R
    - LB:ACT:G2392:SOLEUS_R
    - LB:ACT:G2392:TIB_ANT_R
    assumptions:
    - instantaneous_two_stage_optimization
    - rigid_tendons
    - no_passive_fiber_force_in_baseline
    - fiber_damping_zero
    - gait2392_muscle_paths_on_d1_kinematics
    - conditional_path_length_jumps_retained
  squat_d4:
    kind: executable_specification
    decision: D-062
    description: 'The Stage D4 squat model, stated here and assembled by generic code (src/model_assembly.py). The
      segment tree is not restated: it is derived from joint CONNECTS, bone REPRESENTED_BY and frame PART_OF, with
      the endpoint rule of D-062 Amendment 1. Values stay in the datasets named below.'
    computational_model: gait2392
    plane: sagittal
    datasets:
      geometry: segments_gait2392.yaml
      anthropometry: segments_de_leva_1996.yaml
      actuators: muscles_gait2392.yaml
    segments:
    - LB:SEG:FOOT_R
    - LB:SEG:SHANK_R
    - LB:SEG:THIGH_R
    - LB:SEG:HAT
    ground:
      segment: LB:SEG:FOOT_R
      reference_frame: LB:FRAME:GAIT2392_TALUS_R
      contact_points:
        heel: LB:FRAME:GAIT2392_CALCN_R
        ball: LB:FRAME:GAIT2392_TOES_R
      ground_line_through: heel
      assumption: 'Foot fixed flat on the ground; heel = origin of the calcaneus frame (subtalar joint), ball = origin
        of the toes frame (metatarsophalangeal joint), ground line through the heel point (D-058; demonstration
        assumptions).'
    variants:
      moving_knee:
        description: Gait2392's moving knee in both the dynamics and the muscle geometry (D-060). The D4 baseline.
      fixed_knee:
        description: D1's fixed knee centre (Gait2392's knee location at knee angle 0, linearly interpolated; D-058).
          Kept for the regression to D1 and D2.
    modelled_joints:
      LB:JOINT:ANKLE_R:
        coordinate: LB:DOF:ANKLE_DORSI_PLANTAR_R
        child_frame: LB:FRAME:GAIT2392_TALUS_R
        location: LB-QD:G2392:JOINT:ANKLE_R
      LB:JOINT:KNEE_R:
        coordinate: LB:DOF:KNEE_FLEX_EXT_R
        child_frame: LB:FRAME:GAIT2392_TIBIA_R
        location:
          moving_knee: LB-QD:G2392:JOINT:KNEE_R_MOVING
          fixed_knee: LB-QD:G2392:JOINT:KNEE_R
      LB:JOINT:HIP_R:
        coordinate: LB:DOF:HIP_FLEX_EXT_R
        child_frame: LB:FRAME:GAIT2392_FEMUR_R
        location: LB-QD:G2392:JOINT:HIP_R
    merged_joints:
      LB:JOINT:LUMBAR_GAIT2392:
        into: LB:SEG:HAT
        child_frame: LB:FRAME:GAIT2392_TORSO
        location: LB-QD:G2392:JOINT:BACK
        state: locked at zero
      LB:JOINT:SUBTALAR_R:
        into: LB:SEG:FOOT_R
        child_frame: LB:FRAME:GAIT2392_CALCN_R
        location: LB-QD:G2392:JOINT:SUBTALAR_R
        state: locked at zero
      LB:JOINT:MTP_R:
        into: LB:SEG:FOOT_R
        child_frame: LB:FRAME:GAIT2392_TOES_R
        location: LB-QD:G2392:JOINT:MTP_R
        state: locked at zero
    retained_coordinates:
    - LB:DOF:ANKLE_DORSI_PLANTAR_R
    - LB:DOF:KNEE_FLEX_EXT_R
    - LB:DOF:HIP_FLEX_EXT_R
    omitted_coordinates:
    - LB:DOF:HIP_AB_AD_R
    - LB:DOF:HIP_ROTATION_R
    bilateral_share:
      LB:SEG:HAT: 0.5
    bilateral_share_assumption: Bilateral symmetry; one leg carries half of the HAT (D-058).
    scaled_actuator_parameters:
    - optimal_fiber_length
    - tendon_slack_length
    scaled_actuator_parameters_note: Lengths scaled by the body's geometry scale, as in D-059 item 7; maximum isometric
      force, pennation and maximum contraction velocity are not scaled.
    actuators:
    - LB:ACT:G2392:GLUT_MAX1_R
    - LB:ACT:G2392:GLUT_MAX2_R
    - LB:ACT:G2392:GLUT_MAX3_R
    - LB:ACT:G2392:BIFEMLH_R
    - LB:ACT:G2392:SEMIMEM_R
    - LB:ACT:G2392:SEMITEN_R
    - LB:ACT:G2392:VAS_MED_R
    - LB:ACT:G2392:VAS_INT_R
    - LB:ACT:G2392:VAS_LAT_R
    - LB:ACT:G2392:RECT_FEM_R
    - LB:ACT:G2392:MED_GAS_R
    - LB:ACT:G2392:LAT_GAS_R
    - LB:ACT:G2392:SOLEUS_R
    - LB:ACT:G2392:TIB_ANT_R
    bodies:
      gait2392:
        body_mass: LB-QD:G2392:BODY_MASS
        stature: LB-QD:G2392:STATURE
        geometry_scale: reference
        segment_rules:
          LB:SEG:FOOT_R:
            rule: composite
          LB:SEG:SHANK_R:
            rule: direct
          LB:SEG:THIGH_R:
            rule: direct
          LB:SEG:HAT:
            rule: composite
      female:
        body_mass: LB-QD:DELEVA:F:BODY_MASS
        stature: LB-QD:DELEVA:F:STATURE
        geometry_scale: stature_ratio_to_reference
        segment_rules:
          LB:SEG:FOOT_R:
            rule: scaled_fraction
            mass_fraction_terms:
            - [1, [LB-QD:DELEVA:F:FOOT:MASS_FRACTION]]
            shape: scaled_reference
          LB:SEG:SHANK_R:
            rule: scaled_fraction
            mass_fraction_terms:
            - [1, [LB-QD:DELEVA:F:SHANK:MASS_FRACTION]]
            center_of_mass_fraction: LB-QD:DELEVA:F:SHANK:CENTER_OF_MASS_FRACTION
            radius_of_gyration_fraction: LB-QD:DELEVA:F:SHANK:RADIUS_OF_GYRATION_FRACTION
            length_to: LB-QD:G2392:JOINT:ANKLE_R
          LB:SEG:THIGH_R:
            rule: scaled_fraction
            mass_fraction_terms:
            - [1, [LB-QD:DELEVA:F:THIGH:MASS_FRACTION]]
            center_of_mass_fraction: LB-QD:DELEVA:F:THIGH:CENTER_OF_MASS_FRACTION
            radius_of_gyration_fraction: LB-QD:DELEVA:F:THIGH:RADIUS_OF_GYRATION_FRACTION
            length_to: LB-QD:G2392:JOINT:KNEE_R
          LB:SEG:HAT:
            rule: scaled_fraction
            mass_fraction_terms:
            - [1, [LB-QD:DELEVA:F:HEAD:MASS_FRACTION]]
            - [1, [LB-QD:DELEVA:F:TRUNK:MASS_FRACTION]]
            - [2, [LB-QD:DELEVA:F:UPPER_ARM:MASS_FRACTION, LB-QD:DELEVA:F:FOREARM:MASS_FRACTION, LB-QD:DELEVA:F:HAND:MASS_FRACTION]]
            shape: scaled_reference
      male:
        body_mass: LB-QD:DELEVA:M:BODY_MASS
        stature: LB-QD:DELEVA:M:STATURE
        geometry_scale: stature_ratio_to_reference
        segment_rules:
          LB:SEG:FOOT_R:
            rule: scaled_fraction
            mass_fraction_terms:
            - [1, [LB-QD:DELEVA:M:FOOT:MASS_FRACTION]]
            shape: scaled_reference
          LB:SEG:SHANK_R:
            rule: scaled_fraction
            mass_fraction_terms:
            - [1, [LB-QD:DELEVA:M:SHANK:MASS_FRACTION]]
            center_of_mass_fraction: LB-QD:DELEVA:M:SHANK:CENTER_OF_MASS_FRACTION
            radius_of_gyration_fraction: LB-QD:DELEVA:M:SHANK:RADIUS_OF_GYRATION_FRACTION
            length_to: LB-QD:G2392:JOINT:ANKLE_R
          LB:SEG:THIGH_R:
            rule: scaled_fraction
            mass_fraction_terms:
            - [1, [LB-QD:DELEVA:M:THIGH:MASS_FRACTION]]
            center_of_mass_fraction: LB-QD:DELEVA:M:THIGH:CENTER_OF_MASS_FRACTION
            radius_of_gyration_fraction: LB-QD:DELEVA:M:THIGH:RADIUS_OF_GYRATION_FRACTION
            length_to: LB-QD:G2392:JOINT:KNEE_R
          LB:SEG:HAT:
            rule: scaled_fraction
            mass_fraction_terms:
            - [1, [LB-QD:DELEVA:M:HEAD:MASS_FRACTION]]
            - [1, [LB-QD:DELEVA:M:TRUNK:MASS_FRACTION]]
            - [2, [LB-QD:DELEVA:M:UPPER_ARM:MASS_FRACTION, LB-QD:DELEVA:M:FOREARM:MASS_FRACTION, LB-QD:DELEVA:M:HAND:MASS_FRACTION]]
            shape: scaled_reference
    body_rule_notes: 'direct = the segment''s own Gait2392 body values; composite = the Gait2392 bodies of the merged
      segments, combined by the parallel-axis theorem with the merged joints at zero; scaled_fraction = mass from de
      Leva body-mass fractions (sum of count x the listed fractions, in order); with length_to, the centre of mass at
      the de Leva fraction of the line from the segment frame origin (its first endpoint) to that joint location, and
      inertia = mass x (radius fraction x length)^2; with shape scaled_reference, centre of mass, contact points and
      radius of gyration scaled from the reference body''s composite. The geometry scale of a non-reference body is its
      stature / the reference stature, applied to every joint location and path point (D-058 Amendment 2, D-059 item 7).'
    assumptions:
    - sagittal_plane_motion
    - bilateral_symmetry_one_leg_carries_half_HAT
    - foot_fixed_flat_to_ground
    - rigid_segments
    - low_back_subtalar_and_mtp_joints_locked
    - prescribed_motion_inverse_dynamics
    - instantaneous_two_stage_optimization
    - rigid_tendons
    - no_passive_fiber_force_in_baseline
    - fiber_damping_zero
    - conditional_path_length_jumps_retained
    expected_direction_deviations:   # D-063 Amendment 1 (ChatGPT D5-R01): declared, and confirmed by the OpenSim reference;
    # only disagreements of at least 1 mm need a declaration (medial gastrocnemius peaks at 0.61 mm and is recorded in C5)
    - actuator: LB:ACT:G2392:LAT_GAS_R
      coordinate: LB:DOF:KNEE_FLEX_EXT_R
      variants: [fixed_knee]
      drives: knee_extension
      basis: 'Model basis: with D1''s fixed knee centre, Gait2392''s lateral gastrocnemius path has a small knee-extension
        moment arm near the deepest pose, although the muscle''s declared knee action is flexion (D-062 Amendment 1,
        ChatGPT D062-B01, confirmed with matched OpenSim 4.6 geometry). Attributed to the simplified fixed knee: with
        the moving knee the disagreement does not occur.'
  squat_d4_iliopsoas:
    kind: executable_specification
    extends: squat_d4
    decision: D-062 item 8
    description: 'The Stage D4 growth test: squat_d4 with Gait2392''s iliacus_r and psoas_r added as data only (no
      change to src/ or tools/). Their anatomy was already in hip.yaml with evidence; each has a path point switched
      by the hip coordinate.'
    add_actuators:
    - LB:ACT:G2392:ILIACUS_R
    - LB:ACT:G2392:PSOAS_R
  squat_d5:
    kind: executable_specification
    extends: squat_d4_iliopsoas
    decision: D-063
    description: 'The Stage D5 squat: squat_d4_iliopsoas with Gait2392''s 27 remaining leg actuators, added as data
      (no change to src/ or tools/, A2). 43 actuators; the same physics as D4 (item 7).'
    add_actuators:
    - LB:ACT:G2392:GLUT_MED1_R
    - LB:ACT:G2392:GLUT_MED2_R
    - LB:ACT:G2392:GLUT_MED3_R
    - LB:ACT:G2392:GLUT_MIN1_R
    - LB:ACT:G2392:GLUT_MIN2_R
    - LB:ACT:G2392:GLUT_MIN3_R
    - LB:ACT:G2392:BIFEMSH_R
    - LB:ACT:G2392:SAR_R
    - LB:ACT:G2392:ADD_LONG_R
    - LB:ACT:G2392:ADD_BREV_R
    - LB:ACT:G2392:ADD_MAG1_R
    - LB:ACT:G2392:ADD_MAG2_R
    - LB:ACT:G2392:ADD_MAG3_R
    - LB:ACT:G2392:TFL_R
    - LB:ACT:G2392:PECT_R
    - LB:ACT:G2392:GRAC_R
    - LB:ACT:G2392:QUAD_FEM_R
    - LB:ACT:G2392:GEM_R
    - LB:ACT:G2392:PERI_R
    - LB:ACT:G2392:TIB_POST_R
    - LB:ACT:G2392:FLEX_DIG_R
    - LB:ACT:G2392:FLEX_HAL_R
    - LB:ACT:G2392:PER_BREV_R
    - LB:ACT:G2392:PER_LONG_R
    - LB:ACT:G2392:PER_TERT_R
    - LB:ACT:G2392:EXT_DIG_R
    - LB:ACT:G2392:EXT_HAL_R
    expected_direction_deviations:   # D-063 Amendment 1: each confirmed by the matched OpenSim reference
    - actuator: LB:ACT:G2392:ADD_BREV_R
      coordinate: LB:DOF:HIP_FLEX_EXT_R
      variants: [moving_knee, fixed_knee]
      drives: hip_extension
      basis: 'Model and source disagree: Gait2392''s adductor brevis path has a hip-extension moment arm in part of the squat, while the chapter read (StatPearls, Thigh Muscles) states that the adductors ''adduct and flex the thigh''. Recorded as found; neither the anatomy nor the model is changed (D-063 Amendment 1).'
    - actuator: LB:ACT:G2392:ADD_LONG_R
      coordinate: LB:DOF:HIP_FLEX_EXT_R
      variants: [moving_knee, fixed_knee]
      drives: hip_extension
      basis: 'Model and source disagree: Gait2392''s adductor longus path has a hip-extension moment arm in part of the squat, while the chapter read (StatPearls, Thigh Muscles) states that the adductors ''adduct and flex the thigh''. Recorded as found; neither the anatomy nor the model is changed (D-063 Amendment 1).'
    - actuator: LB:ACT:G2392:GEM_R
      coordinate: LB:DOF:HIP_FLEX_EXT_R
      variants: [moving_knee, fixed_knee]
      drives: hip_extension
      basis: 'Model basis: the sagittal projection of Gait2392''s the gemelli (lumped) path gives a hip extension moment arm. The chapters read (StatPearls Hip; Gluteus Medius) state only abduction and rotation for this muscle, so no sagittal capability is declared; in this planar model the actuator can supply hip extension torque without the frontal-plane balance that limits it in a real squat (D-063 item 4).'
    - actuator: LB:ACT:G2392:GEM_R
      coordinate: LB:DOF:HIP_FLEX_EXT_R
      variants: [moving_knee, fixed_knee]
      drives: hip_flexion
      basis: 'Model basis: the sagittal projection of Gait2392''s the gemelli (lumped) path gives a hip flexion moment arm. The chapters read (StatPearls Hip; Gluteus Medius) state only abduction and rotation for this muscle, so no sagittal capability is declared; in this planar model the actuator can supply hip flexion torque without the frontal-plane balance that limits it in a real squat (D-063 item 4).'
    - actuator: LB:ACT:G2392:GLUT_MED1_R
      coordinate: LB:DOF:HIP_FLEX_EXT_R
      variants: [moving_knee, fixed_knee]
      drives: hip_extension
      basis: 'Model basis: the sagittal projection of Gait2392''s gluteus medius path gives a hip extension moment arm. The chapters read (StatPearls Hip; Gluteus Medius) state only abduction and rotation for this muscle, so no sagittal capability is declared; in this planar model the actuator can supply hip extension torque without the frontal-plane balance that limits it in a real squat (D-063 item 4).'
    - actuator: LB:ACT:G2392:GLUT_MED1_R
      coordinate: LB:DOF:HIP_FLEX_EXT_R
      variants: [moving_knee, fixed_knee]
      drives: hip_flexion
      basis: 'Model basis: the sagittal projection of Gait2392''s gluteus medius path gives a hip flexion moment arm. The chapters read (StatPearls Hip; Gluteus Medius) state only abduction and rotation for this muscle, so no sagittal capability is declared; in this planar model the actuator can supply hip flexion torque without the frontal-plane balance that limits it in a real squat (D-063 item 4).'
    - actuator: LB:ACT:G2392:GLUT_MED2_R
      coordinate: LB:DOF:HIP_FLEX_EXT_R
