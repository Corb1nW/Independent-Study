    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_L
      ACTS_ON:
      - LB:JOINT:KNEE_L
      INNERVATED_BY:
      - LB:NERVE:TIBIAL
    mechanical_capabilities:
    - knee_unlocking_rotation
    evidence:
    - SRC:STATPEARLS_LEG_POSTERIOR
    note: From the lateral femoral condyle to the posterior tibia above the soleus; acts only at the knee, unlocking it by
      rotating the tibia on the femur (or the femur on the tibia when weight-bearing), which initiates knee flexion (StatPearls,
      Leg Posterior Compartment). No Gait2392 actuator.
  LB:MUS:PLANTARIS_L:
    name: Left Plantaris
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_L
      - LB:JOINT:ANKLE_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      INNERVATED_BY:
      - LB:NERVE:TIBIAL
    mechanical_capabilities:
    - ankle_plantarflexion
    evidence:
    - SRC:STATPEARLS_LEG_POSTERIOR
    note: From the lateral supracondylar line of the femur to the calcaneal tuberosity beside the calcaneal tendon; a weak
      plantarflexor (StatPearls, Leg Posterior Compartment). The knee crossing follows from those attachments; the chapter
      states no knee action. No Gait2392 actuator.
  LB:MUS:TIBIALIS_POSTERIOR_L:
    name: Left Tibialis Posterior
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      - LB:JOINT:SUBTALAR_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      - LB:JOINT:SUBTALAR_L
      INNERVATED_BY:
      - LB:NERVE:TIBIAL
    mechanical_capabilities:
    - ankle_plantarflexion
    - foot_inversion
    - medial_arch_support
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_LEG_POSTERIOR
    note: From the posterior interosseous membrane to the navicular tuberosity and cuneiforms; plantarflexes the ankle, inverts
      the subtalar joint (out of plane) and supports the medial longitudinal arch (StatPearls, Leg Posterior Compartment).
  LB:MUS:FLEXOR_DIGITORUM_LONGUS_L:
    name: Left Flexor Digitorum Longus
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      - LB:JOINT:MTP_L
      - LB:JOINT:TOE_IP_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      - LB:JOINT:MTP_L
      - LB:JOINT:TOE_IP_L
      INNERVATED_BY:
      - LB:NERVE:TIBIAL
    mechanical_capabilities:
    - ankle_plantarflexion
    - toe_flexion
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_LEG_POSTERIOR
    note: From the posterior middle third of the tibia to the distal phalanges of toes 2-5; flexes their metatarsophalangeal
      and interphalangeal joints and assists ankle plantarflexion (StatPearls, Leg Posterior Compartment).
  LB:MUS:FLEXOR_HALLUCIS_LONGUS_L:
    name: Left Flexor Hallucis Longus
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      - LB:JOINT:MTP_L
      - LB:JOINT:TOE_IP_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      - LB:JOINT:MTP_L
      - LB:JOINT:TOE_IP_L
      INNERVATED_BY:
      - LB:NERVE:TIBIAL
    mechanical_capabilities:
    - ankle_plantarflexion
    - great_toe_flexion
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_LEG_POSTERIOR
    note: From the posterior distal two-thirds of the fibula to the base of the distal phalanx of the hallux; plantarflexes
      the talocrural joint and flexes the hallux's metatarsophalangeal and interphalangeal joints (StatPearls, Leg Posterior
      Compartment).
  LB:MUS:FIBULARIS_LONGUS_L:
    name: Left Fibularis (Peroneus) Longus
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      INNERVATED_BY:
      - LB:NERVE:SUPERFICIAL_FIBULAR
    mechanical_capabilities:
    - foot_eversion
    - ankle_plantarflexion
    - transverse_and_lateral_arch_support
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_LEG_LATERAL
    note: From the fibular head and proximal two-thirds of the lateral fibula to the base of the first metatarsal; primarily
      everts the foot and ankle (out of plane), secondarily plantarflexes, and supports the transverse and lateral arches
      (StatPearls, Leg Lateral Compartment). The chapter does not name the subtalar joint, so no crossing of it is recorded.
  LB:MUS:FIBULARIS_BREVIS_L:
    name: Left Fibularis (Peroneus) Brevis
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      INNERVATED_BY:
      - LB:NERVE:SUPERFICIAL_FIBULAR
    mechanical_capabilities:
    - foot_eversion
    - ankle_plantarflexion
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_LEG_LATERAL
    note: From the lower two-thirds of the lateral fibula to the tuberosity of the fifth metatarsal base; primarily everts
      the foot and ankle (out of plane), secondarily plantarflexes (StatPearls, Leg Lateral Compartment). The chapter does
      not name the subtalar joint, so no crossing of it is recorded.
  LB:MUS:EXTENSOR_DIGITORUM_LONGUS_L:
    name: Left Extensor Digitorum Longus
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      INNERVATED_BY:
