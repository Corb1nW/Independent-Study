models:
  squat_d1:
    represents:
    - LB:SEG:FOOT_R
    - LB:SEG:SHANK_R
    - LB:SEG:THIGH_R
    - LB:SEG:HAT
    - LB:JOINT:ANKLE_R
    - LB:JOINT:KNEE_R
    - LB:JOINT:HIP_R
    assumptions:
    - sagittal_plane_motion
    - bilateral_symmetry_one_leg_carries_half_HAT
    - foot_fixed_flat_to_ground
    - joints_idealized_revolute_with_fixed_centres
    - rigid_segments
    - low_back_joint_locked
    - prescribed_motion_inverse_dynamics
    retained_coordinates:
    - LB:DOF:ANKLE_DORSI_PLANTAR_R
    - LB:DOF:KNEE_FLEX_EXT_R
    - LB:DOF:HIP_FLEX_EXT_R
    omitted_coordinates:
    - LB:DOF:HIP_AB_AD_R
    - LB:DOF:HIP_ROTATION_R
  squat_d2:
    extends: squat_d1
    represents:
    - LB:ACT:G2392:GLUT_MAX1_R
    - LB:ACT:G2392:GLUT_MAX2_R
    - LB:ACT:G2392:GLUT_MAX3_R
    - LB:ACT:G2392:BIFEMLH_R
    - LB:ACT:G2392:SEMIMEM_R
    - LB:ACT:G2392:SEMITEN_R
    - LB:ACT:G2392:VAS_MED_R
    - LB:ACT:G2392:VAS_INT_R
    - LB:ACT:G2392:VAS_LAT_R
    - LB:ACT:G2392:RECT_FEM_R
    - LB:ACT:G2392:MED_GAS_R
    - LB:ACT:G2392:LAT_GAS_R
    - LB:ACT:G2392:SOLEUS_R
    - LB:ACT:G2392:TIB_ANT_R
    assumptions:
    - instantaneous_two_stage_optimization
    - rigid_tendons
    - no_passive_fiber_force_in_baseline
    - fiber_damping_zero
    - gait2392_muscle_paths_on_d1_kinematics
    - conditional_path_length_jumps_retained
sources:
  SRC:STATPEARLS_THIGH_MUSCLES:
