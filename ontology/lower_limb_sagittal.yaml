    note: From the distal anterior fibula and interosseous membrane, often as a distal extension of extensor digitorum longus,
      to the dorsal base of the fifth metatarsal; weakly assists dorsiflexion and contributes to eversion (out of plane) (StatPearls,
      Leg Anterior Compartment).
