relationship_additions:
# D-062 item 5 (the demo review's P1): knee edges for four muscles defined in hip.yaml, which cannot refer to the
# knee joints defined here. Checked against SRC:STATPEARLS_THIGH_MUSCLES (statpearls.com/point-of-care/24169) on
# 2026-11-16 before adding (paraphrased in 'basis'). SRC:STATPEARLS_HIP, which these entities cite, was also read
# (as statpearls.com/point-of-care/32220, the chapter of the same title, editor S. Sharma): its accessible text names these muscles only for their
# innervation, so it is not cited for these edges.
- entity: LB:MUS:BICEPS_FEMORIS_LONG_R
  add:
    CROSSES:
    - LB:JOINT:KNEE_R
    ACTS_ON:
    - LB:JOINT:KNEE_R
  evidence:
  - SRC:STATPEARLS_THIGH_MUSCLES
  basis: 'StatPearls, Thigh Muscles (read 2026-11-16): the long and short heads of the biceps femoris share a tendon that inserts at the head of the fibula; the hamstrings flex the knee.'
  decision: D-062 item 5
