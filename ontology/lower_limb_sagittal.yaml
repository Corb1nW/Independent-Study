    - toe_extension
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_LEG_ANTERIOR
    note: From the lateral tibial condyle, anterior fibula and interosseous membrane to the dorsal expansions of toes 2-5;
      extends toes 2-5 and assists dorsiflexion (StatPearls, Leg Anterior Compartment). The chapter does not name the toe
      joints, so only the ankle crossing is recorded.
  LB:MUS:EXTENSOR_HALLUCIS_LONGUS_L:
    name: Left Extensor Hallucis Longus
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      INNERVATED_BY:
      - LB:NERVE:DEEP_FIBULAR
    mechanical_capabilities:
