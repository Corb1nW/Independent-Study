# Phase D module (D-058). Loaded together with hip.yaml; IDs are unique across files.
ontology_module:
  extends: LB-AO
  module: lower_limb_sagittal
  version: 0.2.0
  description: Knee, ankle, foot, shank and upper-body segments, coordinates and model frames for the planar squat
    (Phase D, D-058); muscles and model actuators for Stage D2 (D-059, 0.2.0).
  decision: D-058, D-059
class_hierarchy:
  SynovialHingeJoint: SynovialJoint
entities:
  LB:BODY:WHOLE:
    name: Whole Human Body
    class: WholeBody
    note: Carrier for whole-body anthropometric values (body mass, stature). Population or model specific values
      are observations, never properties of this entity.
  LB:BONE:TIBIA_R:
    name: Right Tibia
    class: Bone
    side: right
    relationships:
      REPRESENTED_BY:
      - LB:SEG:SHANK_R
  LB:BONE:TALUS_R:
    name: Right Talus
    class: Bone
    side: right
    relationships:
      REPRESENTED_BY:
      - LB:SEG:FOOT_R
  LB:BONE:CALCANEUS_R:
    name: Right Calcaneus
    class: Bone
    side: right
    relationships:
      REPRESENTED_BY:
      - LB:SEG:FOOT_R
  LB:BONE:TIBIA_L:
    name: Left Tibia
    class: Bone
    side: left
    relationships:
      REPRESENTED_BY:
      - LB:SEG:SHANK_L
  LB:BONE:TALUS_L:
    name: Left Talus
    class: Bone
    side: left
    relationships:
      REPRESENTED_BY:
      - LB:SEG:FOOT_L
  LB:BONE:CALCANEUS_L:
    name: Left Calcaneus
    class: Bone
    side: left
    relationships:
      REPRESENTED_BY:
      - LB:SEG:FOOT_L
  LB:JOINT:KNEE_R:
    name: Right Knee Joint
    class: SynovialHingeJoint
    side: right
    relationships:
      CONNECTS:
      - LB:BONE:FEMUR_R
      - LB:BONE:TIBIA_R
      HAS_COORDINATE:
      - LB:DOF:KNEE_FLEX_EXT_R
    note: Represented in Stage D1 as an idealized revolute joint with a fixed centre (D-058); the anatomical knee
      also translates and rotates about other axes.
  LB:JOINT:ANKLE_R:
    name: Right Ankle (Talocrural) Joint
    class: SynovialHingeJoint
    side: right
    relationships:
      CONNECTS:
      - LB:BONE:TIBIA_R
      - LB:BONE:TALUS_R
      HAS_COORDINATE:
      - LB:DOF:ANKLE_DORSI_PLANTAR_R
  LB:JOINT:SUBTALAR_R:
    name: Right Subtalar Joint
    class: SynovialJoint
    side: right
    relationships:
      CONNECTS:
      - LB:BONE:TALUS_R
      - LB:BONE:CALCANEUS_R
    note: Locked inside the fixed foot in Stage D1; its Gait2392 location is used only to place the heel.
  LB:JOINT:MTP_R:
    name: Right Metatarsophalangeal Joints (lumped)
    class: SynovialJoint
    side: right
    note: Lumped as one joint, as in Gait2392. Locked inside the fixed foot in Stage D1; its location marks the
      ball of the foot.
  LB:DOF:KNEE_FLEX_EXT_R:
    name: Right Knee Flexion/Extension
    class: JointCoordinate
    side: right
    relationships:
      PART_OF:
      - LB:JOINT:KNEE_R
    convention: 'Declared model convention (D-058 Amendment 1, A4): relative sagittal angle between thigh and shank
      frames, flexion positive, zero in the Gait2392 default pose. Not attributed to a published convention.'
  LB:DOF:ANKLE_DORSI_PLANTAR_R:
    name: Right Ankle Dorsiflexion/Plantarflexion
    class: JointCoordinate
    side: right
    relationships:
      PART_OF:
      - LB:JOINT:ANKLE_R
    convention: 'Declared model convention (D-058 Amendment 1, A4): relative sagittal angle between foot and shank
      frames, dorsiflexion positive, zero in the Gait2392 default pose. Not attributed to Wu et al. 2002, whose
      definitions were not checked for the planar case.'
  LB:JOINT:KNEE_L:
    name: Left Knee Joint
    class: SynovialHingeJoint
    side: left
    relationships:
      CONNECTS:
      - LB:BONE:FEMUR_L
      - LB:BONE:TIBIA_L
      HAS_COORDINATE:
      - LB:DOF:KNEE_FLEX_EXT_L
    note: Represented in Stage D1 as an idealized revolute joint with a fixed centre (D-058); the anatomical knee
      also translates and rotates about other axes.
  LB:JOINT:ANKLE_L:
    name: Left Ankle (Talocrural) Joint
    class: SynovialHingeJoint
    side: left
    relationships:
      CONNECTS:
      - LB:BONE:TIBIA_L
      - LB:BONE:TALUS_L
      HAS_COORDINATE:
      - LB:DOF:ANKLE_DORSI_PLANTAR_L
  LB:JOINT:SUBTALAR_L:
    name: Left Subtalar Joint
    class: SynovialJoint
    side: left
    relationships:
      CONNECTS:
      - LB:BONE:TALUS_L
      - LB:BONE:CALCANEUS_L
    note: Locked inside the fixed foot in Stage D1; its Gait2392 location is used only to place the heel.
  LB:JOINT:MTP_L:
    name: Left Metatarsophalangeal Joints (lumped)
    class: SynovialJoint
    side: left
    note: Lumped as one joint, as in Gait2392. Locked inside the fixed foot in Stage D1; its location marks the
      ball of the foot.
  LB:DOF:KNEE_FLEX_EXT_L:
    name: Left Knee Flexion/Extension
    class: JointCoordinate
    side: left
    relationships:
      PART_OF:
      - LB:JOINT:KNEE_L
    convention: 'Declared model convention (D-058 Amendment 1, A4): relative sagittal angle between thigh and shank
      frames, flexion positive, zero in the Gait2392 default pose. Not attributed to a published convention.'
  LB:DOF:ANKLE_DORSI_PLANTAR_L:
    name: Left Ankle Dorsiflexion/Plantarflexion
    class: JointCoordinate
    side: left
    relationships:
      PART_OF:
      - LB:JOINT:ANKLE_L
    convention: 'Declared model convention (D-058 Amendment 1, A4): relative sagittal angle between foot and shank
      frames, dorsiflexion positive, zero in the Gait2392 default pose. Not attributed to Wu et al. 2002, whose
      definitions were not checked for the planar case.'
  LB:JOINT:LUMBAR_GAIT2392:
    name: Gait2392 Low-Back Joint (pelvis to torso)
    class: ModelJoint
    relationships:
      CONNECTS:
      - LB:SEG:PELVIS
      - LB:SEG:TORSO
    note: A model joint of OpenSim Gait2392 (Anderson and Pandy), not an anatomical joint. Locked at zero in Stage
      D1, so pelvis and torso move as one HAT segment.
  LB:SEG:SHANK_R:
    name: Right Shank Rigid-Body Segment
    class: RigidBodySegment
    side: right
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:FOOT_R:
    name: Right Foot Rigid-Body Segment
    class: RigidBodySegment
    side: right
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:UPPER_ARM_R:
    name: Right Upper Arm Rigid-Body Segment
    class: RigidBodySegment
    side: right
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:FOREARM_R:
    name: Right Forearm Rigid-Body Segment
    class: RigidBodySegment
    side: right
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:HAND_R:
    name: Right Hand Rigid-Body Segment
    class: RigidBodySegment
    side: right
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:SHANK_L:
    name: Left Shank Rigid-Body Segment
    class: RigidBodySegment
    side: left
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:FOOT_L:
    name: Left Foot Rigid-Body Segment
    class: RigidBodySegment
    side: left
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:UPPER_ARM_L:
    name: Left Upper Arm Rigid-Body Segment
    class: RigidBodySegment
    side: left
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:FOREARM_L:
    name: Left Forearm Rigid-Body Segment
    class: RigidBodySegment
    side: left
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:HAND_L:
    name: Left Hand Rigid-Body Segment
    class: RigidBodySegment
    side: left
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
  LB:SEG:HEAD:
    name: 'Head Rigid-Body Segment (de Leva: vertex to mid-gonion)'
    class: RigidBodySegment
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
  LB:SEG:TRUNK_DELEVA:
    name: 'Trunk Rigid-Body Segment (de Leva: suprasternale to mid-hip, includes the pelvis)'
    class: RigidBodySegment
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    note: 'Overlaps LB:SEG:PELVIS and LB:SEG:TORSO: a different way of dividing the same body. Never combine it
      with them in one model.'
  LB:SEG:TORSO:
    name: 'Torso Rigid-Body Segment (Gait2392: head, arms and trunk above the low-back joint)'
    class: RigidBodySegment
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
  LB:SEG:HAT:
    name: Head-Arms-Trunk (HAT) Rigid-Body Segment
    class: RigidBodySegment
    model_properties:
    - mass
    - center_of_mass
    - inertia_tensor
    - pose
    note: 'Everything above the hip joints as one rigid body (D-058). Male: LB:SEG:PELVIS + LB:SEG:TORSO from Gait2392
      with the low-back joint locked. Female: mass from de Leva head, trunk and both arms; geometry scaled from
      the male HAT (D-058 Amendment 2).'
  LB:FRAME:GAIT2392_PELVIS:
    name: Gait2392 body frame 'pelvis'
    class: CoordinateFrame
    relationships:
      PART_OF:
      - LB:SEG:PELVIS
    convention: 'OpenSim Gait2392 body frame: x anterior, y superior, z to the right, in metres; orientation as
      in the model''s default pose. A model frame, not an anatomical (ISB) frame.'
  LB:FRAME:GAIT2392_FEMUR_R:
    name: Gait2392 body frame 'femur_r'
    class: CoordinateFrame
    relationships:
      PART_OF:
      - LB:SEG:THIGH_R
    convention: 'OpenSim Gait2392 body frame: x anterior, y superior, z to the right, in metres; orientation as
      in the model''s default pose. A model frame, not an anatomical (ISB) frame.'
  LB:FRAME:GAIT2392_TIBIA_R:
    name: Gait2392 body frame 'tibia_r'
    class: CoordinateFrame
    relationships:
      PART_OF:
      - LB:SEG:SHANK_R
    convention: 'OpenSim Gait2392 body frame: x anterior, y superior, z to the right, in metres; orientation as
      in the model''s default pose. A model frame, not an anatomical (ISB) frame.'
  LB:FRAME:GAIT2392_TALUS_R:
    name: Gait2392 body frame 'talus_r'
    class: CoordinateFrame
    relationships:
      PART_OF:
      - LB:SEG:FOOT_R
    convention: 'OpenSim Gait2392 body frame: x anterior, y superior, z to the right, in metres; orientation as
      in the model''s default pose. A model frame, not an anatomical (ISB) frame.'
  LB:FRAME:GAIT2392_CALCN_R:
    name: Gait2392 body frame 'calcn_r'
    class: CoordinateFrame
    relationships:
      PART_OF:
      - LB:SEG:FOOT_R
    convention: 'OpenSim Gait2392 body frame: x anterior, y superior, z to the right, in metres; orientation as
      in the model''s default pose. A model frame, not an anatomical (ISB) frame.'
  LB:FRAME:GAIT2392_TOES_R:
    name: Gait2392 body frame 'toes_r'
    class: CoordinateFrame
    relationships:
      PART_OF:
      - LB:SEG:FOOT_R
    convention: 'OpenSim Gait2392 body frame: x anterior, y superior, z to the right, in metres; orientation as
      in the model''s default pose. A model frame, not an anatomical (ISB) frame.'
  LB:FRAME:GAIT2392_TORSO:
    name: Gait2392 body frame 'torso'
    class: CoordinateFrame
    relationships:
      PART_OF:
      - LB:SEG:TORSO
    convention: 'OpenSim Gait2392 body frame: x anterior, y superior, z to the right, in metres; orientation as
      in the model''s default pose. A model frame, not an anatomical (ISB) frame.'
  LB:MUS:VASTUS_LATERALIS_R:
    name: Right Vastus Lateralis
    class: SkeletalMuscle
    side: right
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_R
      ACTS_ON:
      - LB:JOINT:KNEE_R
      INNERVATED_BY:
      - LB:NERVE:FEMORAL
      REPRESENTED_BY:
      - LB:ACT:G2392:VAS_LAT_R
    mechanical_capabilities:
    - knee_extension
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_THIGH_MUSCLES
    note: 'Quadriceps part; arises from the femur and crosses the knee only (StatPearls, Thigh Muscles). Attachment landmarks not yet modeled as entities.'
  LB:MUS:VASTUS_LATERALIS_L:
    name: Left Vastus Lateralis
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_L
      ACTS_ON:
      - LB:JOINT:KNEE_L
      INNERVATED_BY:
      - LB:NERVE:FEMORAL
    mechanical_capabilities:
    - knee_extension
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_THIGH_MUSCLES
    note: 'Quadriceps part; arises from the femur and crosses the knee only (StatPearls, Thigh Muscles). Attachment landmarks not yet modeled as entities.'
  LB:MUS:VASTUS_MEDIALIS_R:
    name: Right Vastus Medialis
    class: SkeletalMuscle
    side: right
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_R
      ACTS_ON:
      - LB:JOINT:KNEE_R
      INNERVATED_BY:
      - LB:NERVE:FEMORAL
      REPRESENTED_BY:
      - LB:ACT:G2392:VAS_MED_R
    mechanical_capabilities:
    - knee_extension
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_THIGH_MUSCLES
    note: 'Quadriceps part; arises from the femur and crosses the knee only (StatPearls, Thigh Muscles). Attachment landmarks not yet modeled as entities.'
  LB:MUS:VASTUS_MEDIALIS_L:
    name: Left Vastus Medialis
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_L
      ACTS_ON:
      - LB:JOINT:KNEE_L
      INNERVATED_BY:
      - LB:NERVE:FEMORAL
    mechanical_capabilities:
    - knee_extension
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_THIGH_MUSCLES
    note: 'Quadriceps part; arises from the femur and crosses the knee only (StatPearls, Thigh Muscles). Attachment landmarks not yet modeled as entities.'
  LB:MUS:VASTUS_INTERMEDIUS_R:
    name: Right Vastus Intermedius
    class: SkeletalMuscle
    side: right
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_R
      ACTS_ON:
      - LB:JOINT:KNEE_R
      INNERVATED_BY:
      - LB:NERVE:FEMORAL
      REPRESENTED_BY:
      - LB:ACT:G2392:VAS_INT_R
    mechanical_capabilities:
    - knee_extension
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_THIGH_MUSCLES
    note: 'Quadriceps part; arises from the anterolateral upper femur and crosses the knee only (StatPearls, Thigh Muscles). Attachment landmarks not yet modeled as entities.'
  LB:MUS:VASTUS_INTERMEDIUS_L:
    name: Left Vastus Intermedius
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_L
      ACTS_ON:
      - LB:JOINT:KNEE_L
      INNERVATED_BY:
      - LB:NERVE:FEMORAL
    mechanical_capabilities:
    - knee_extension
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_THIGH_MUSCLES
    note: 'Quadriceps part; arises from the anterolateral upper femur and crosses the knee only (StatPearls, Thigh Muscles). Attachment landmarks not yet modeled as entities.'
  LB:MUS:GASTROCNEMIUS_R:
    name: Right Gastrocnemius
    class: SkeletalMuscle
    side: right
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_R
      - LB:JOINT:ANKLE_R
      ACTS_ON:
      - LB:JOINT:KNEE_R
      - LB:JOINT:ANKLE_R
      INNERVATED_BY:
      - LB:NERVE:TIBIAL
      REPRESENTED_BY:
      - LB:ACT:G2392:MED_GAS_R
      - LB:ACT:G2392:LAT_GAS_R
    mechanical_capabilities:
    - ankle_plantarflexion
    - knee_flexion
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_GASTROCNEMIUS
    note: 'Medial and lateral heads from the femoral condyle region; inserts on the calcaneus through the calcaneal tendon; plantarflexes the ankle and assists knee flexion (StatPearls, Gastrocnemius Muscle). Each head is a separate Gait2392 actuator.'
  LB:MUS:GASTROCNEMIUS_L:
    name: Left Gastrocnemius
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:KNEE_L
      - LB:JOINT:ANKLE_L
      ACTS_ON:
      - LB:JOINT:KNEE_L
      - LB:JOINT:ANKLE_L
      INNERVATED_BY:
      - LB:NERVE:TIBIAL
    mechanical_capabilities:
    - ankle_plantarflexion
    - knee_flexion
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_GASTROCNEMIUS
    note: 'Medial and lateral heads from the femoral condyle region; inserts on the calcaneus through the calcaneal tendon; plantarflexes the ankle and assists knee flexion (StatPearls, Gastrocnemius Muscle). Each head is a separate Gait2392 actuator.'
  LB:MUS:SOLEUS_R:
    name: Right Soleus
    class: SkeletalMuscle
    side: right
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_R
      ACTS_ON:
      - LB:JOINT:ANKLE_R
      INNERVATED_BY:
      - LB:NERVE:TIBIAL
      REPRESENTED_BY:
      - LB:ACT:G2392:SOLEUS_R
    mechanical_capabilities:
    - ankle_plantarflexion
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_GASTROCNEMIUS
    note: 'Deep part of the triceps surae, from the fibula and the soleal line of the tibia to the calcaneus through the calcaneal tendon; monoarticular; also contributes to subtalar inversion, which the sagittal model omits (StatPearls, Gastrocnemius Muscle).'
  LB:MUS:SOLEUS_L:
    name: Left Soleus
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      INNERVATED_BY:
      - LB:NERVE:TIBIAL
    mechanical_capabilities:
    - ankle_plantarflexion
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_GASTROCNEMIUS
    note: 'Deep part of the triceps surae, from the fibula and the soleal line of the tibia to the calcaneus through the calcaneal tendon; monoarticular; also contributes to subtalar inversion, which the sagittal model omits (StatPearls, Gastrocnemius Muscle).'
  LB:MUS:TIBIALIS_ANTERIOR_R:
    name: Right Tibialis Anterior
    class: SkeletalMuscle
    side: right
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_R
      ACTS_ON:
      - LB:JOINT:ANKLE_R
      INNERVATED_BY:
      - LB:NERVE:DEEP_FIBULAR
      REPRESENTED_BY:
      - LB:ACT:G2392:TIB_ANT_R
    mechanical_capabilities:
    - ankle_dorsiflexion
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_LEG_ANTERIOR
    note: 'From the lateral tibia and interosseous membrane to the medial cuneiform and first metatarsal base; strongest dorsiflexor; also inverts the foot, which the sagittal model omits (StatPearls, Leg Anterior Compartment).'
  LB:MUS:TIBIALIS_ANTERIOR_L:
    name: Left Tibialis Anterior
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
      INNERVATED_BY:
      - LB:NERVE:DEEP_FIBULAR
    mechanical_capabilities:
    - ankle_dorsiflexion
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_LEG_ANTERIOR
    note: 'From the lateral tibia and interosseous membrane to the medial cuneiform and first metatarsal base; strongest dorsiflexor; also inverts the foot, which the sagittal model omits (StatPearls, Leg Anterior Compartment).'
  LB:NERVE:TIBIAL:
    name: Tibial Nerve
    class: PeripheralNerveOrNerveSource
    evidence:
    - SRC:STATPEARLS_GASTROCNEMIUS
  LB:NERVE:DEEP_FIBULAR:
    name: Deep Fibular (Peroneal) Nerve
    class: PeripheralNerveOrNerveSource
    note: Branch of the common fibular nerve, from the sciatic nerve (StatPearls, Leg Anterior Compartment).
    evidence:
    - SRC:STATPEARLS_LEG_ANTERIOR
  LB:ACT:G2392:GLUT_MAX1_R:
    name: Gait2392 actuator glut_max1_r
    class: ModelActuator
    side: right
    represents: LB:MUS:GLUTEUS_MAXIMUS_R
    represented_scope: superior compartment (Gait2392 part 1 of 3)
    note: A computational actuator of OpenSim Gait2392 used in the squat_d2 model view (D-059 item 11), not an
      anatomical structure. 'represents' names the anatomical muscle; new muscles in this module also link back
      through REPRESENTED_BY, while hip.yaml muscles do not, so that hip.yaml still loads on its own.
    evidence:
    - SRC:GAIT2392_OSIM
  LB:ACT:G2392:GLUT_MAX2_R:
    name: Gait2392 actuator glut_max2_r
