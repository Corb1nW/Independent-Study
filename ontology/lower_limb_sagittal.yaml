    - great_toe_extension
    model_parameter_schema:
    - maximum_isometric_force
    - optimal_fiber_length
    - tendon_slack_length
    - pennation_angle_at_optimal
    - maximum_contraction_velocity
    evidence:
    - SRC:STATPEARLS_LEG_ANTERIOR
    note: From the middle anterior fibula and interosseous membrane to the dorsal distal phalanx of the hallux; extends the
      hallux and assists dorsiflexion (StatPearls, Leg Anterior Compartment). The chapter does not name the toe joints, so
      only the ankle crossing is recorded.
  LB:MUS:FIBULARIS_TERTIUS_L:
    name: Left Fibularis (Peroneus) Tertius
    class: SkeletalMuscle
    side: left
    relationships:
      CROSSES:
      - LB:JOINT:ANKLE_L
      ACTS_ON:
      - LB:JOINT:ANKLE_L
